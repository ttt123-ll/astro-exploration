# 离线分发版：直接使用已导入的镜像，不重新构建
#   docker load -i astro-web-image.tar
#   docker load -i mysql-image.tar
#   docker compose -f docker-compose.offline.yml up -d
name: astro

services:
  db:
    image: mysql:8.0
    container_name: astro-db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-astro}
      MYSQL_USER: ${DB_USER:-astro}
      MYSQL_PASSWORD: ${DB_PASSWORD:?请设置 DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  app:
    image: astro-web:latest
    container_name: astro-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "3000"
      TZ: Asia/Shanghai
      TZ_OFFSET: "+08:00"
      NO_OPEN: "1"
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-astro}
      DB_USER: ${DB_USER:-astro}
      DB_PASSWORD: ${DB_PASSWORD:?}
      JWT_SECRET: ${JWT_SECRET:?请设置 JWT_SECRET}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请设置 ADMIN_PASSWORD}
    ports:
      - "${HOST_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  db_data:
