<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宇宙探索 · 移动端</title>
<style>
    :root { --bg: #05060a; }
    * { box-sizing: border-box; }
    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;          /* 外层禁止滚动 */
        background: var(--bg);
    }
    body {
        position: fixed;           /* 固定一屏，避免缩放后产生滚动区域 */
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background:
            radial-gradient(60% 50% at 50% 0%, rgba(70, 100, 180, .22), transparent 70%),
            radial-gradient(40% 40% at 15% 80%, rgba(157, 140, 240, .15), transparent 70%),
            var(--bg);
    }
    /* 缩放层：绝对定位，不参与外层布局尺寸计算 */
    .stage {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        pointer-events: none;
    }
    /* 手机外框：按视口高度整体缩放，始终完整可见、不产生外层滚动 */
    .phone {
        pointer-events: auto;
        width: 414px;
        height: 872px;
        padding: 14px 12px;
        border-radius: 46px;
        background: linear-gradient(160deg, #1a2233, #0a0f1a 60%);
        border: 1px solid rgba(159, 212, 248, .28);
        box-shadow: 0 30px 80px rgba(0, 0, 0, .65), 0 0 0 6px rgba(255, 255, 255, .03) inset;
        position: relative;
        transform: scale(var(--scale, 1));
        transform-origin: center center;
        flex: none;
    }
    .phone::before {
        content: '';
        position: absolute;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        width: 108px;
        height: 22px;
        background: #05060a;
        border-radius: 0 0 16px 16px;
        z-index: 3;
    }
    .screen {
        width: 390px;
        height: 844px;
        border-radius: 36px;
        overflow: hidden;
        background: #05060a;
        position: relative;
    }
    iframe {
        width: 390px;
        height: 844px;
        border: 0;
        display: block;
    }
</style>
</head>
<body>
    <div class="stage">
        <div class="phone" id="phone">
            <div class="screen">
                <iframe id="mobile-frame" src="/" title="宇宙探索移动端" loading="eager"></iframe>
            </div>
        </div>
    </div>
    <script src="/m.js" defer></script>
</body>
</html>
