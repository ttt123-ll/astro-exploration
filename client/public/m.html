<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宇宙探索 · 移动端</title>
<style>
    :root { --bg: #05060a; }
    * { box-sizing: border-box; }
    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: var(--bg);
    }
    body {
        position: fixed;
        inset: 0;
        overflow: hidden;
        background:
            radial-gradient(55% 45% at 50% 8%, rgba(70, 100, 180, .26), transparent 72%),
            radial-gradient(40% 40% at 12% 82%, rgba(157, 140, 240, .18), transparent 72%),
            radial-gradient(38% 38% at 88% 78%, rgba(110, 164, 232, .14), transparent 72%),
            var(--bg);
    }
    .stage {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        pointer-events: none;
    }

    /* ===== 手机设备外框 ===== */
    .phone {
        pointer-events: auto;
        position: relative;
        width: 424px;                 /* 414 机身 + 左右按钮预留 */
        height: 880px;
        padding: 16px;
        border-radius: 54px;
        background:
            linear-gradient(150deg, #2a3448 0%, #121a28 26%, #070b12 62%, #1b2434 100%);
        border: 1px solid rgba(159, 212, 248, .30);
        box-shadow:
            0 40px 90px rgba(0, 0, 0, .75),
            0 0 0 2px rgba(255, 255, 255, .05) inset,
            0 0 0 10px rgba(255, 255, 255, .02),
            0 0 70px rgba(120, 170, 255, .16);
        transform: scale(var(--scale, .85));
        transform-origin: center center;
        flex: none;
    }
    /* 屏幕下层金属亮边 */
    .phone::before {
        content: '';
        position: absolute;
        inset: 7px;
        border-radius: 48px;
        border: 1px solid rgba(255, 255, 255, .10);
        pointer-events: none;
    }
    /* 灵动岛 */
    .phone .island {
        position: absolute;
        top: 26px;
        left: 50%;
        transform: translateX(-50%);
        width: 112px;
        height: 24px;
        border-radius: 0 0 15px 15px;
        background: #04050a;
        z-index: 4;
        pointer-events: none;
    }
    .phone .island::after {
        content: '';
        position: absolute;
        right: 14px;
        top: 8px;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #3a5b8a, #0a1220 70%);
    }
    /* 侧边实体按键 */
    .phone .side {
        position: absolute;
        width: 4px;
        border-radius: 3px;
        background: linear-gradient(180deg, #3a475e, #1b2434);
        box-shadow: 0 0 0 1px rgba(255, 255, 255, .05);
        pointer-events: none;
    }
    .phone .side.vol1 { left: -3px; top: 180px; height: 46px; }
    .phone .side.vol2 { left: -3px; top: 238px; height: 46px; }
    .phone .side.power { right: -3px; top: 214px; height: 76px; }
    .phone .side.mute { left: -3px; top: 132px; height: 26px; }
    /* 屏幕 */
    .screen {
        width: 392px;
        height: 848px;
        border-radius: 38px;
        overflow: hidden;
        background: #05060a;
        position: relative;
        z-index: 2;
    }
    iframe {
        width: 392px;
        height: 848px;
        border: 0;
        display: block;
        background: #05060a;
    }
</style>
</head>
<body>
    <div class="stage">
        <div class="phone" id="phone">
            <span class="side mute"></span>
            <span class="side vol1"></span>
            <span class="side vol2"></span>
            <span class="side power"></span>
            <span class="island"></span>
            <div class="screen">
                <iframe id="mobile-frame" src="/" title="宇宙探索移动端" loading="eager"></iframe>
            </div>
        </div>
    </div>
    <script src="/m.js?v=3" defer></script>
</body>
</html>
